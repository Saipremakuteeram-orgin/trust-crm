services:
  - type: web
    name: trust-crm-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx puppeteer browsers install chrome
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "mail@saidharmasamrakshanapremakuteeram.qzz.io"
      - key: RESEND_FROM_NAME
        value: "Sathya Sai Prema Kuteeram"
      - key: CONTACT_EMAIL
        value: "info@saidharmasamrakshanapremakuteeram.qzz.io"
      - key: CONTACT_PHONE
        value: "+91-7598265955"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_STORAGE_CHAT_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_COMMON_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_USER_EMAIL
        sync: false
      - key: WA_SESSION_ENCRYPTION_KEY
        sync: false
      - key: PUPPETEER_EXECUTABLE_PATH
        sync: false
